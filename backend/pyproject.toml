[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aerostudio"
version = "0.1.0"
description = "Backend for AeroSurrogate Studio: mesh morphing, MeshGraphNet surrogate serving, optimization API"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2.3",
  "scipy>=1.13",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sse-starlette>=2.1",
  "pymoo>=0.6.1",
]

[project.optional-dependencies]
# The MeshGraphNet engine. torch/torch_scatter must be installed from the matching wheel
# index first (see README); versions follow the surrogate repo's requirements.txt.
surrogate = ["torch>=2.4,<2.10", "torch_geometric>=2.5,<2.7", "torch_scatter", "nvidia-physicsnemo==2.0.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["aerostudio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running (all-pairs morphing)"]
